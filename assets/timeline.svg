<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Timeline: ISET Kairouan (2023), Leoni internship (2024), IEEE Student Branch webmaster (2024 to 2026), WavyLab internship (2025), YOHATECH end-of-studies internship (2026), freelance (2026), EPI Digital School (2026 onward)">
  <title>Timeline: ISET Kairouan (2023), Leoni internship (2024), IEEE Student Branch webmaster (2024 to 2026), WavyLab internship (2025), YOHATECH end-of-studies internship (2026), freelance (2026), EPI Digital School (2026 onward)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="1" stop-color="#0D1430"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="axis" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="0.92" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2747"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="frameclip"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>
  <style>
.flow { animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.box { animation: pop .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.live { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
</style>
  <g clip-path="url(#frameclip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)" opacity="0.55"/>
    <circle cx="1100" cy="40" r="170" fill="#A78BFA" opacity="0.12" filter="url(#soft)"/>
    <circle cx="80" cy="420" r="170" fill="#2DD4BF" opacity="0.12" filter="url(#soft)"/>

    <!-- header -->
    <text x="40" y="52" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" letter-spacing="2.5" fill="#2DD4BF">TIMELINE  ·  2023 → TODAY</text>
    <text x="40" y="84" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="27" fill="#E8EEF9">Education, internships and freelance work</text>

    <!-- legend -->
    <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" fill="#8C98B8">
      <circle cx="766" cy="79" r="5" fill="#38BDF8"/><text x="778" y="84">education</text>
      <circle cx="872" cy="79" r="5" fill="#2DD4BF"/><text x="884" y="84">internship</text>
      <circle cx="986" cy="79" r="5" fill="#A78BFA"/><text x="998" y="84">freelance</text>
      <circle cx="1084" cy="79" r="5" fill="#FBBF24"/><text x="1096" y="84">community</text>
    </g>

    <!-- axis -->
    <line x1="60" y1="260" x2="1140" y2="260" stroke="#1C2747" stroke-width="2"/>
    <line x1="60" y1="260" x2="1140" y2="260" stroke="url(#axis)" stroke-width="2" stroke-dasharray="7 5" class="flow"/>
    <circle r="4" fill="#E8EEF9" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M 60 260 H 1140"/></circle>

    <!-- 1 · 2023 · ISET Kairouan (above) -->
    <g class="box" style="animation-delay:0.0s">
      <line x1="150" y1="210" x2="150" y2="250" stroke="#38BDF8" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="150" cy="260" r="10" fill="#0B1226" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="150" cy="260" r="4" fill="#38BDF8"/>
      <text x="150" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#38BDF8">2023</text>
      <text x="150" y="174" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">ISET Kairouan</text>
      <text x="150" y="198" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Licence, Info. Systems Dev.</text>
    </g>

    <!-- 2 · 2024 · Leoni (below) -->
    <g class="box" style="animation-delay:0.15s">
      <line x1="300" y1="270" x2="300" y2="306" stroke="#2DD4BF" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="300" cy="260" r="10" fill="#0B1226" stroke="#2DD4BF" stroke-width="2.5"/>
      <circle cx="300" cy="260" r="4" fill="#2DD4BF"/>
      <text x="300" y="328" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#2DD4BF">2024</text>
      <text x="300" y="356" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">Leoni</text>
      <text x="300" y="380" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Web Developer Intern</text>
    </g>

    <!-- 3 · 2024–2026 · IEEE (above) -->
    <g class="box" style="animation-delay:0.3s">
      <line x1="450" y1="210" x2="450" y2="250" stroke="#FBBF24" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="450" cy="260" r="10" fill="#0B1226" stroke="#FBBF24" stroke-width="2.5"/>
      <circle cx="450" cy="260" r="4" fill="#FBBF24"/>
      <text x="450" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#FBBF24">2024 – 2026</text>
      <text x="450" y="174" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">IEEE Student Branch</text>
      <text x="450" y="198" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Webmaster</text>
    </g>

    <!-- 4 · 2025 · WavyLab (below) -->
    <g class="box" style="animation-delay:0.45s">
      <line x1="600" y1="270" x2="600" y2="306" stroke="#2DD4BF" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="600" cy="260" r="10" fill="#0B1226" stroke="#2DD4BF" stroke-width="2.5"/>
      <circle cx="600" cy="260" r="4" fill="#2DD4BF"/>
      <text x="600" y="328" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#2DD4BF">2025</text>
      <text x="600" y="356" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">WavyLab</text>
      <text x="600" y="380" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Web Developer Intern</text>
    </g>

    <!-- 5 · 2026 · YOHATECH (above) -->
    <g class="box" style="animation-delay:0.6s">
      <line x1="750" y1="210" x2="750" y2="250" stroke="#2DD4BF" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="750" cy="260" r="10" fill="#0B1226" stroke="#2DD4BF" stroke-width="2.5"/>
      <circle cx="750" cy="260" r="4" fill="#2DD4BF"/>
      <text x="750" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#2DD4BF">2026</text>
      <text x="750" y="174" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">YOHATECH</text>
      <text x="750" y="198" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">End-of-studies internship</text>
    </g>

    <!-- 6 · 2026 · Freelance (below) -->
    <g class="box" style="animation-delay:0.75s">
      <line x1="900" y1="270" x2="900" y2="306" stroke="#A78BFA" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="900" cy="260" r="10" fill="#0B1226" stroke="#A78BFA" stroke-width="2.5"/>
      <circle cx="900" cy="260" r="4" fill="#A78BFA"/>
      <text x="900" y="328" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#A78BFA">2026</text>
      <text x="900" y="356" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">Freelance</text>
      <text x="900" y="380" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Full Stack · remote, Germany</text>
    </g>

    <!-- 7 · 2026 → · EPI Digital School (above, current) -->
    <g class="box" style="animation-delay:0.9s">
      <line x1="1050" y1="210" x2="1050" y2="250" stroke="#38BDF8" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <circle cx="1050" cy="260" r="10" fill="none" stroke="#38BDF8" stroke-opacity="0.6">
        <animate attributeName="r" values="10;22" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="260" r="10" fill="#0B1226" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="1050" cy="260" r="4" fill="#38BDF8" class="live"/>
      <text x="1050" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" fill="#38BDF8">2026 → now</text>
      <text x="1050" y="174" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#E8EEF9">EPI Digital School</text>
      <text x="1050" y="198" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Cloud Computing &amp; Networks</text>
