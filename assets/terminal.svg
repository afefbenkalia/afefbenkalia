ily="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#A78BFA">  ai</tspan><tspan fill="#56628A">:            </tspan><tspan fill="#FBBF24">[AI agents, agent skills, dynamic agentic workflows, AI-assisted development]</tspan></text><text x="36" y="267.5" class="ln" style="animation-delay:1.99s" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#A78BFA">  studying</tspan><tspan fill="#56628A">:      </tspan><tspan fill="#E8EEF9">Engineering Cycle in Cloud Computing &amp; Networks @ EPI Digital School</tspan></text><text x="36" y="294.5" class="ln" style="animation-delay:2.17s" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#A78BFA">  ways_of_work</tspan><tspan fill="#56628A">:  </tspan><tspan fill="#FBBF24">[Agile Scrum, UML modeling, requirements gathering, product ownership]</tspan></text><text x="36" y="321.5" class="ln" style="animation-delay:2.35s" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#A78BFA">  speaks</tspan><tspan fill="#56628A">:        </tspan><tspan fill="#FBBF24">[Arabic: native, French: intermediate, English: intermediate]</tspan></text><text x="36" y="362.0" class="ln" style="animation-delay:2.53s" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#2DD4BF">afef</tspan><tspan fill="#56628A">@</tspan><tspan fill="#38BDF8">sousse</tspan><tspan fill="#56628A">:~$ </tspan><tspan fill="#E8EEF9">./status --now</tspan></text><text x="36" y="389.0" class="ln" style="animation-delay:2.98s" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16.5"><tspan fill="#34D399">  ● </tspan><tspan fill="#E8EEF9">open to </tspan><tspan fill="#34D399" font-weight="700">junior Full Stack Developer</tspan><tspan fill="#E8EEF9"> roles</tspan><tspan fill="#56628A">  ·  based in Sousse, Tunisia</tspan></text>
    
