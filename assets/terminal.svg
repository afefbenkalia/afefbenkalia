<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="426" viewBox="0 0 1200 426" role="img" aria-label="Terminal: whoami — Afef Ben Kalia, Full Stack Developer; profile summary; open to junior Full Stack Developer roles">
  <title>Terminal: whoami — Afef Ben Kalia, Full Stack Developer; profile summary; open to junior Full Stack Developer roles</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="1" stop-color="#0D1430"/>
