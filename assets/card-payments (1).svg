<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-label="Sanefli architecture: Browser to Laravel to a FastAPI tool-calling agent and an OpenAI-compatible LLM; 142 automated tests">
  <title>Sanefli architecture: Browser to Laravel to a FastAPI tool-calling agent and an OpenAI-compatible LLM; 142 automated tests</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
