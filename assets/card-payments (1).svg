B8">/api/agent/*</text><line x1="962" y1="215" x2="1006" y2="215" stroke="#FBBF24" stroke-width="2" stroke-dasharray="7 5" class="flow" marker-end="url(#ah-a)"/><line x1="1006" y1="255" x2="962" y2="255" stroke="#FBBF24" stroke-width="2" stroke-dasharray="7 5" class="flow" marker-end="url(#ah-a)"/><text x="40" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="url(#brand)">142</text><text x="98" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">automated tests</text><text x="263.0" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="url(#brand)">98</text><text x="305.0" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">PHPUnit</text><text x="404.4" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="url(#brand)">44</text><text x="446.4" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">Python unittest</text><text x="611.4" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="url(#brand)">6</text><text x="637.4" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">agent tools</text><text x="769.5999999999999" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="26" fill="url(#brand)">3 min</text><text x="859.5999999999999" y="430" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8C98B8">user-token TTL</text><line x1="40" y1="395" x2="1160" y2="395" stroke="#1C2747"/></g>
