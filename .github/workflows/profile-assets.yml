# Generates every dynamic image on the profile README and publishes them to the
# `output` branch, which the README loads through raw.githubusercontent.com.
#
# Replaces hosted services that are no longer available:
#   - github-readme-stats.vercel.app          -> 503 DEPLOYMENT_PAUSED
#   - github-readme-activity-graph.vercel.app -> 404 DEPLOYMENT_NOT_FOUND
# and creates the snake animation the README already expected.
#
# Optional: add a classic PAT (scopes: repo, read:user) as the repository secret
# GH_STATS_TOKEN to include private contributions in the stats card. Without it
# the built-in GITHUB_TOKEN is used and only public data is counted.

name: Profile assets

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_rank=false&bg_color=0D1430&title_color=2DD4BF&text_color=E8EEF9&icon_color=A78BFA&ring_color=2DD4BF&border_color=1C2747&border_radius=14
          path: dist/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Fail instead of publishing a "Something went wrong" card, so the
          # last good images stay on the output branch.
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=467&bg_color=0D1430&title_color=2DD4BF&text_color=E8EEF9&border_color=1C2747&border_radius=14
          path: dist/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_graph.py --user "${{ github.repository_owner }}" --out dist/activity-graph.svg

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#0D9488
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#161B33,#134E4A,#0F766E,#14B8A6,#5EEAD4

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "Update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
